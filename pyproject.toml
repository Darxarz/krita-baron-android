[tool.ruff]
target-version = "py310"
line-length = 100
include = ["server/compile_workflow.py", "scripts/*.py", "tests/test_engine.py"]
extend-exclude = ["server/vendor", "build", "tools", "orchestrion-integration"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# The server engine and Krita mock paths must precede the engine imports.
ignore = ["E402"]
